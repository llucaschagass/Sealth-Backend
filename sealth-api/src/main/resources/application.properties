spring.application.name=sealth-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Em produção defina JWT_SECRET (o valor padrão serve apenas para desenvolvimento)
api.security.token.secret=${JWT_SECRET:my-secret-key-from-sealth}

# Dados de demonstração carregados na inicialização (demo@sealth.com / 123456)
app.seed.enabled=${SEED_ENABLED:true}

# Origens permitidas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Endereço do front, usado para montar o link de redefinição de senha
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
# Validade do link de redefinição de senha
app.password-reset.expiration-minutes=30
